name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        shell: powershell
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync dependencies with uv
        run: uv sync

      - name: Install eSpeak NG
        shell: powershell
        run: |
          choco install espeak-ng -y
          echo "C:\Program Files\eSpeak NG" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      # BƯỚC DEBUG: Liệt kê tất cả file .py để tìm entry point
      - name: List Python files (Debug)
        shell: powershell
        run: |
          Write-Host "=== DANH SÁCH CÁC FILE PYTHON TRONG DỰ ÁN ==="
          Get-ChildItem -Path . -Filter *.py -Recurse | Where-Object { $_.FullName -notmatch '\.venv' } | Select-Object FullName

      - name: Build EXE with PyInstaller
        shell: powershell
        run: |
          # ⚠️ QUAN TRỌNG: Thay đổi đường dẫn dưới đây cho đúng với repo của bạn.
          # Dựa trên các dự án TTS tương tự, entry point thường là:
          # 'src/vieneu/web/app.py', 'src/vieneu/app.py', 'main.py', hoặc 'webui.py'
          
          # Tôi đang để mặc định là 'src/vieneu/web/app.py' - hãy kiểm tra log ở bước trên để sửa lại nếu cần.
          $ENTRY_POINT = "src/vieneu/web/app.py"
          
          # Thêm --collect-all cho các thư viện quan trọng để tránh lỗi thiếu file model
          uv run pyinstaller --noconfirm --onefile --console --name "VieNeu-TTS" `
            --collect-all "vieneu" `
            --collect-all "gradio" `
            --collect-all "onnxruntime" `
            --collect-all "soundfile" `
            $ENTRY_POINT

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VieNeu-TTS-Windows
          path: dist/VieNeu-TTS.exe
          if-no-files-found: error
