name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        shell: powershell
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync dependencies with uv
        run: uv sync

      - name: Install eSpeak NG
        shell: powershell
        run: |
          choco install espeak-ng -y
          echo "C:\Program Files\eSpeak NG" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      # BƯỚC THÔNG MINH: Tự động tìm file khởi chạy (Entry Point)
      - name: Find Entry Point
        id: find_entry
        shell: powershell
        run: |
          Write-Host "Đang tìm kiếm entry point (các file chứa 'if __name__ == \"__main__\":')..."
          
          # Tìm tất cả các file .py có chứa block main, bỏ qua thư mục .venv và .git
          $EntryPoints = Get-ChildItem -Path . -Filter *.py -Recurse | Where-Object { $_.FullName -notmatch '\.venv' -and $_.FullName -notmatch '\.git' } | Select-String -Pattern 'if __name__ == ["'']__main__["'']' | Select-Object -ExpandProperty Path -Unique
          
          if (-not $EntryPoints) {
              Write-Host "Không tìm thấy file nào chứa 'if __name__ == \"__main__\":'. Sẽ thử tìm các file tên phổ biến..."
              $EntryPoints = Get-ChildItem -Path . -Filter *.py -Recurse | Where-Object { $_.FullName -notmatch '\.venv' -and $_.Name -match '^(app|main|webui|run|cli)\.py$' } | Select-Object -ExpandProperty FullName
          }

          Write-Host "Các file ứng viên tìm thấy:"
          $EntryPoints | ForEach-Object { Write-Host $_ }

          if ($EntryPoints.Count -eq 0) {
              Write-Error "Không thể tìm thấy entry point nào. Vui lòng kiểm tra lại cấu trúc dự án."
              exit 1
          }

          # Ưu tiên chọn file app.py, main.py hoặc file ở thư mục gốc
          $SelectedEntry = $null
          if ($EntryPoints -match 'app\.py$') {
              $SelectedEntry = ($EntryPoints | Where-Object { $_ -match 'app\.py$' } | Select-Object -First 1)
          } elseif ($EntryPoints -match 'main\.py$') {
              $SelectedEntry = ($EntryPoints | Where-Object { $_ -match 'main\.py$' } | Select-Object -First 1)
          } else {
              $SelectedEntry = $EntryPoints[0]
          }

          # Chuyển đường dẫn tuyệt đối thành tương đối so với thư mục gốc repo
          $RelativePath = Resolve-Path -Path $SelectedEntry -Relative
          $RelativePath = $RelativePath -replace '^\.\\', '' -replace '^\./', ''
          
          Write-Host "Đã chọn Entry Point: $RelativePath"
          "ENTRY_POINT=$RelativePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build EXE with PyInstaller
        shell: powershell
        run: |
          Write-Host "Bắt đầu build EXE từ file: $env:ENTRY_POINT"
          
          # Sử dụng biến môi trường ENTRY_POINT đã tìm được ở bước trên
          uv run pyinstaller --noconfirm --onefile --console --name "VieNeu-TTS" `
            --collect-all "vieneu" `
            --collect-all "gradio" `
            --collect-all "onnxruntime" `
            --collect-all "soundfile" `
            "$env:ENTRY_POINT"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VieNeu-TTS-Windows
          path: dist/VieNeu-TTS.exe
          if-no-files-found: error
