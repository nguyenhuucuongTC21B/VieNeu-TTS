name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Cho phép chạy thủ công từ tab Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Yêu cầu Python 3.12+ theo tài liệu dự án

      - name: Install uv
        shell: powershell
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync dependencies with uv
        run: uv sync --extra cpu
        # Sử dụng --extra cpu cho bản CPU (torch-free, ONNX Runtime)
        # Nếu muốn build bản GPU, đổi thành --extra cuda

      - name: Install eSpeak NG (required for phonemization)
        shell: powershell
        run: |
          choco install espeak-ng -y
          # Thêm thư mục cài đặt eSpeak NG vào PATH
          echo "C:\Program Files\eSpeak NG" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Create PyInstaller spec file
        shell: powershell
        run: |
          # Tạo file spec để đóng gói ứng dụng Web UI
          @"
          # -*- mode: python ; coding: utf-8 -*-

          a = Analysis(
              ['vieneu/web/app.py'],
              pathex=[],
              binaries=[],
              datas=[
                  ('src/vieneu/assets', 'vieneu/assets'),
              ],
              hiddenimports=[
                  'vieneu',
                  'onnxruntime',
                  'gradio',
                  'soundfile',
                  'numpy',
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              noarchive=False,
          )
          pyz = PYZ(a.pure)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.datas,
              [],
              name='VieNeu-TTS',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              upx_exclude=[],
              runtime_tmpdir=None,
              console=True,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )
          "@ | Out-File -FilePath build.spec -Encoding utf8

      - name: Build EXE with PyInstaller
        run: pyinstaller build.spec --clean --noconfirm

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VieNeu-TTS-Windows
          path: dist/VieNeu-TTS.exe
          if-no-files-found: error
