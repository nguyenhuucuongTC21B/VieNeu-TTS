name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Cho phép chạy thủ công từ tab Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        shell: powershell
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync dependencies with uv
        run: uv sync
        # ĐÃ SỬA: Bỏ --extra cpu vì dự án không định nghĩa extra này.
        # Nếu dự án cần extra khác, hãy sửa thành --extra <tên_extra>

      - name: Install eSpeak NG (required for phonemization)
        shell: powershell
        run: |
          choco install espeak-ng -y
          echo "C:\Program Files\eSpeak NG" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build EXE with PyInstaller
        shell: powershell
        run: |
          # Tìm file entry point (thường là app.py hoặc main.py)
          # Thay 'app.py' bằng file chính xác nếu dự án của bạn dùng tên khác
          uv run pyinstaller --noconfirm --onefile --console --name "VieNeu-TTS" --collect-all "vieneu" app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VieNeu-TTS-Windows
          path: dist/VieNeu-TTS.exe
          if-no-files-found: error
